<body><aside class="sidebar"><div class="brand"><span class="brand-mark">E</span> EvalDock <small>DESKTOP</small></div><div class="nav-label">工作空间</div><nav><a href="#home" data-page="home">◈ <span>概览</span></a><a href="#agents" data-page="agents">◎ <span>我的 Agent</span></a><a href="#datasets" data-page="datasets">▦ <span>测试集</span></a><a href="#reports" data-page="reports">▤ <span>评测记录</span></a></nav><div class="sidebar-bottom"><a href="#settings" data-page="settings">⚙ <span>设置</span></a><a href="/">↗ <span>高级工作台</span></a><div class="local"><i></i> 本地工作空间</div></div></aside><main><header class="topbar"><span id="breadcrumb">工作空间 / 概览</span><span class="badge">MAC · 本地运行</span></header><div id="notice" role="status" hidden></div><div id="content"><div class="empty">正在连接本地评测服务…</div></div></main><dialog id="evaluation"><form id="evaluation-form"><div class="dialog-heading"><div><span class="eyebrow">NEW EVALUATION</span><h2>开始一次评测</h2></div><button type="button" id="close-dialog" class="icon-button" aria-label="关闭">×</button></div><label>选择 Agent<select id="agent-select" required></select></label><label>评测方式<select id="mode-select"><option value="EFFECT">效果测试 · 查看最终交付</option><option value="FULL">完整流程 · 分析执行过程与交付</option></select></label><label>选题方式<select id="selection-kind"><option value="STANDARD">自动选题（默认）</option><option value="SELECTED">手动选题</option></select></label><p id="automatic-selection-note" class="muted">Planner 将根据 Agent 的能力和配置，从本地题库自动选择测试集与题目。</p><fieldset id="manual-selection" hidden disabled><legend>选择本地测试集</legend><div id="dataset-selection"></div></fieldset><p class="muted">本轮将执行评测，并调用已配置的模型服务选题和评分。可能产生 API 费用。</p><p id="evaluation-error" role="alert"></p><button type="button" id="evaluation-agent-setup" hidden>前往我的 Agent</button><button class="primary" id="submit-evaluation" type="submit">开始评测</button></form></dialog><script type="module" src="app.js"></script></body></html>
