function render(){document.body.className=mode==='data'?'':mode;document.querySelectorAll('[data-style]').forEach(b=>{b.classList.toggle('active',b.dataset.style===mode);b.setAttribute('aria-selected',String(b.dataset.style===mode));});document.getElementById('app').innerHTML='<div class="shell">'+nav()+'<main class="appmain">'+header()+'<div class="page">'+title()+steps()+(stage!==2?stageView():mode==='flow'?flowView():mode==='dark'?darkView():dataView())+'<div class="footerhint"><span>'+({data:'清爽数据台 · 适合批量筛选和横向比较',flow:'流程工作台 · 适合发起评测和跟踪任务',dark:'深色调试台 · 适合逐步排查执行与证据'}[mode])+'</span><span>页面中的题目、计数、分数均为设计示例</span></div></div></main></div><div class="drawer-backdrop" id="drawer-backdrop"><aside class="drawer" role="dialog" aria-modal="true" aria-label="示例题目详情" id="drawer"></aside></div>';}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openCase(index){currentCase=index;const c=cases[index];const exampleFile=['销售汇总.csv','关键指标.md','计算结果.json','季度预算.xlsx','合同条款.md','订单趋势.csv'][index];document.getElementById('drawer').innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;color:#8b94a4;font-size:11px"><span>题目详情 · 示例数据</span><button class="circlebutton" data-close aria-label="关闭详情">'+icon('close')+'</button></div><h2>'+c.title+'</h2>'+badge(c.status)+'<p>'+c.data+' · '+c.tag+'<br>本题运行记录和内容均为设计演示，不是实际评测结果。</p><div class="drawer-tabs"><b>全部证据</b><span>标签评分</span><span>题目与输入</span></div><div class="evidencecard"><div class="type">智能体记录</div><p>工具返回了本题执行记录，原始内容可进一步展开。</p><pre>工具：终端\n动作：处理本题输入\n结果：执行完成</pre></div><div class="evidencecard"><div class="type">外部环境变化</div><p>文件系统观测到输出目录新增文件。</p><pre>文件：'+exampleFile+'\n变化：新增\n采集状态：内容已归档</pre></div><div class="evidencecard"><div class="type">最终交付物</div><p>'+exampleFile+' · 示例文件</p><button class="btn" data-action="download">'+icon('download')+'预览交付物</button></div>';if(c.status==='wait'){document.querySelectorAll('#drawer .evidencecard').forEach(x=>x.remove());document.getElementById('drawer').insertAdjacentHTML('beforeend','<div class="empty">本题尚未执行，暂时没有证据与评分。</div>');}document.getElementById('drawer-backdrop').classList.add('open');document.querySelector('[data-close]').focus();}
let toastTimer;function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3300);}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-case]');if(e.target.id==='drawer-backdrop'){e.target.classList.remove('open');return;}if(!b)return;if(b.dataset.style){mode=b.dataset.style;stage=2;localStorage.setItem('evaldock-design',mode);render();return;}if(b.dataset.stage!==undefined){stage=Number(b.dataset.stage);render();return;}if(b.dataset.filter){filter=b.dataset.filter;render();return;}if(b.dataset.case!==undefined){openCase(Number(b.dataset.case));return;}if(b.hasAttribute('data-close')){document.getElementById('drawer-backdrop').classList.remove('open');return;}if(b.dataset.go){if(b.dataset.go==='tasks'){stage=2;render();}else if(b.dataset.go==='resources'){stage=1;render();toast('这里预览评测资源的展示样式');}else toast('设计原型：配置编辑将在正式工作台中提供');return;}if(b.dataset.action==='clear'){filter='all';query='';datasetFilters.clear();render();return;}if(b.dataset.action==='report'){stage=4;render();return;}if(b.dataset.action==='download'){toast('这是示例产物，未连接真实文件');return;}if(b.dataset.action==='stop'){toast('设计预览：不会停止或启动任何真实评测');return;}toast('设计预览：此操作暂未连接真实评测接口');});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;document.getElementById('rows').innerHTML=rows();}});
document.addEventListener('change',e=>{if(e.target.dataset.dataset){const x=e.target.dataset.dataset;e.target.checked?datasetFilters.add(x):datasetFilters.delete(x);document.getElementById('rows').innerHTML=rows();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('drawer-backdrop')?.classList.remove('open');if(e.key==='Enter'&&e.target.dataset.case!==undefined)openCase(Number(e.target.dataset.case));});
render();
</script></body></html>
