function caseSpecification(c,index){
const d=activeRun?caseDetailSnapshot[runKey()]?.[c.id]:demoCaseSpecifications[index];
if(!d)return '<p class="empty">本批次没有保存题目详情。</p>';
const items=(values,empty)=>values?.length?values.map(x=>'<div class="spec-path">'+esc(x)+'</div>').join(''):'<span class="spec-empty">'+esc(empty)+'</span>';
const task=d.task||'未保存任务原文';
const contractAt=task.indexOf('Execution contract:');
const mainTask=contractAt>0?task.slice(0,contractAt).trim():task;
const contract=contractAt>0?task.slice(contractAt):'';
return '<div class="case-spec">'+(!activeRun?'<span class="badge">题目示例</span>':'')+'<div class="spec-task-section"><h3 class="subheading">任务内容</h3><pre class="textblock spec-task">'+esc(mainTask)+'</pre>'+(contract?'<details class="spec-contract"><summary>执行约束 · 原文</summary><pre class="textblock">'+esc(contract)+'</pre></details>':'')+'</div><div class="spec-info-grid"><section class="spec-info-card"><h3 class="subheading">输入</h3>'+items(d.inputs,'未记录文件输入')+'</section><section class="spec-info-card"><h3 class="subheading">'+(activeRun?'允许写入':'预期交付物')+'</h3>'+items(d.output,'未记录输出位置')+'</section><section class="spec-info-card spec-grading"><h3 class="subheading">评分维度</h3><div class="spec-labels">'+Object.keys(c.scores).map(l=>'<span class="catalog-label">'+esc(labelDisplay(l))+'</span>').join('')+'</div>'+(d.reference?'<details class="spec-reference"><summary>本题评分参考</summary><p>'+esc(d.reference)+'</p></details>':'<span class="spec-empty">本题评分参考未记录</span>')+'</section></div>'+(activeRun?'<details class="spec-metadata"><summary>环境与记录来源</summary><dl><div><dt>环境</dt><dd>'+esc(d.environment||'未记录')+'</dd></div><div><dt>时限</dt><dd>'+(d.deadline?Math.round(d.deadline/60000)+' 分钟':'未记录')+'</dd></div><div><dt>来源</dt><dd>'+esc(d.source||'未记录')+'</dd></div></dl></details>':'')+'</div>';
}

function aggregate(){return dimensions.map(label=>{
let total=0,weights=0,valid=0,nil=0,error=0,pending=0,covered=0,unavailable=0;
let scale=null,standard=null,mixed=false;
cases.forEach(c=>{const r=c.scores[label];if(!r)return;covered++;
const current=r.scale||activeRun?.scoreScale||{min:0,max:4};
if(r.state==='scored'&&Number.isFinite(r.value)){
if(scale&&(scale.min!==current.min||scale.max!==current.max))mixed=true;
scale=current;
if(r.standardDigest){if(standard&&standard!==r.standardDigest)mixed=true;standard=r.standardDigest;}
total+=r.value*c.weight;weights+=c.weight;valid++;}
else if(r.state==='null')nil++;else if(r.state==='error')error++;else if(r.state==='pending')pending++;else unavailable++;});
return {label,value:weights&&!mixed?Math.round((total/weights+Number.EPSILON)*100)/100:null,min:scale?.min??activeRun?.scoreScale?.min??0,max:scale?.max??activeRun?.scoreScale?.max??4,mixed,valid,nil,error,pending,covered,unavailable};});}

function abilityRadar(items){
const n=items.length;
if(n<3)return '<div class="ability-empty">至少覆盖 3 个维度后展示雷达图</div>';
const cx=350,cy=266,r=168,outer=207;
const uniform=items.every(d=>d.min===items[0].min&&d.max===items[0].max);
const point=(i,radius)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*radius,cy+Math.sin(a)*radius];};
const xy=p=>p.map(v=>v.toFixed(2)).join(',');
const available=d=>d.value!==null&&!d.mixed&&Number.isFinite(d.value)&&d.max>d.min;
const points=items.map((d,i)=>available(d)?point(i,r*Math.max(0,Math.min(1,(d.value-d.min)/(d.max-d.min)))):null);
let grid='',axes='',series='',labels='';
for(let ring=1;ring<=5;ring++){
 grid+='<polygon class="ability-ring" points="'+items.map((_,i)=>xy(point(i,r*ring/5))).join(' ')+'"/>';
 const tick=uniform?Number((items[0].min+(items[0].max-items[0].min)*ring/5).toFixed(1)):ring*20+'%';
 grid+='<text class="ability-tick" x="'+(cx+7)+'" y="'+(cy-r*ring/5-4)+'">'+tick+'</text>';
}
items.forEach((d,i)=>{
 const end=point(i,r),label=point(i,outer),a=-Math.PI/2+i*2*Math.PI/n;
 axes+='<line class="ability-axis" x1="'+cx+'" y1="'+cy+'" x2="'+end[0]+'" y2="'+end[1]+'"/>';
 const name=labelDisplay(d.label),words=name.split(' '),lines=[];
 let line='';
 for(const word of words){if(line&&(line+' '+word).length>18){lines.push(line);line=word;}else line+=(line?' ':'')+word;}
 if(line)lines.push(line);
 const anchor=Math.cos(a)>.18?'start':Math.cos(a)<-.18?'end':'middle';
 const score=available(d)?d.value.toFixed(2):'—';
 labels+='<text class="ability-axis-label'+(available(d)?'':' unavailable')+'" text-anchor="'+anchor+'" x="'+label[0]+'" y="'+(label[1]-(lines.length-1)*7)+'">'+lines.map((text,j)=>'<tspan x="'+label[0]+'" dy="'+(j?15:0)+'">'+esc(text)+'</tspan>').join('')+'<tspan class="ability-axis-score" x="'+label[0]+'" dy="19">'+score+'</tspan></text>';
 if(!available(d))axes+='<circle class="ability-missing" cx="'+end[0]+'" cy="'+end[1]+'" r="4"><title>'+esc(name)+'：'+(d.mixed?'评分标准不同':'暂无有效评分')+'</title></circle>';
});
if(points.every(Boolean))series='<polygon class="ability-area" points="'+points.map(xy).join(' ')+'"/>';
else points.forEach((p,i)=>{const next=points[(i+1)%n];if(p&&next)series+='<line class="ability-segment" x1="'+p[0]+'" y1="'+p[1]+'" x2="'+next[0]+'" y2="'+next[1]+'"/>';});
points.forEach((p,i)=>{if(p){const d=items[i];const text=labelDisplay(d.label)+'：'+d.value.toFixed(2)+' / '+d.max+'，'+d.valid+' / '+d.covered+' Case 有效';series+='<circle class="ability-point" tabindex="0" role="img" aria-label="'+esc(text)+'" cx="'+p[0]+'" cy="'+p[1]+'" r="4.5"><title>'+esc(text)+'</title></circle>';}});
return '<svg class="ability-radar" viewBox="0 0 700 535" role="img" aria-label="Agent 能力雷达图"><title>当前批次的 Agent 能力分布</title><desc>由中心向外表示得分提高。空缺表示没有有效汇总分数，不代表零分。</desc>'+grid+axes+series+labels+'</svg>';
}

function paintDrawer(){if(!drawerMode)return;const c=cases[selectedCase];if(!c)return;const drawer=document.getElementById('drawer');
if(drawerMode==='evidence'){drawer.innerHTML='<div class="drawer-head"><span>Case '+(selectedCase+1)+' · 证据目录</span><button data-close aria-label="关闭详情">关闭</button></div><p>按历史 manifest.json 列出文件，当前不加载完整文件内容。</p><table class="info"><tbody>'+(c.files||[]).filter(f=>/^(evidence|trace|observers|artifacts)\//.test(f.path)).map(f=>'<tr><td>'+esc(f.path)+'</td><td>'+esc(f.bytes)+' 字节</td></tr>').join('')+'</tbody></table>';}
else drawer.innerHTML='<div class="drawer-head"><span>'+esc(currentAgentName())+' / Case '+(selectedCase+1)+'</span><button data-close aria-label="关闭详情">关闭</button></div>'+casePanel();
document.getElementById('shade').classList.add('open');}
function render(){captureScroll();const el=document.activeElement;let focus=null;if(el?.id)focus='#'+el.id;else if(el?.dataset)for(const name of ['caseTab','filter','group','agent','dataset']){if(el.dataset[name]){focus='[data-'+name.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())+'="'+CSS.escape(el.dataset[name])+'"]';break;}}
renderUI();paintDrawer();restoreScroll();if(focus)document.querySelector(focus)?.focus({preventScroll:true});persistUI();}
function openCase(i){captureScroll();rememberAgentView();lastFocused=document.activeElement;selectedCase=i;caseTab=caseTabs[runKey()+'::'+selectedCase]||'live';drawerMode='case';render();document.querySelector('[data-close]')?.focus({preventScroll:true});}
function closeDrawer(){captureScroll();drawerMode=null;document.getElementById('shade')?.classList.remove('open');persistUI();}

let timer;function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),3500);}

document.addEventListener('click',e=>{
if(e.target.id==='report-overlay'){reportOpen=false;render();return;}if(e.target.id==='shade'){closeDrawer();return;}const b=e.target.closest('button,[data-case]');if(!b)return;
captureScroll();rememberAgentView();
if(b.hasAttribute('data-full-report')){stopPlayback();drawerMode=null;reportCaseId=null;reportOpen=true;render();document.querySelector('[data-report-back]')?.focus({preventScroll:true});return;}
if(b.hasAttribute('data-report-back')){reportOpen=false;render();document.querySelector('[data-full-report]')?.focus({preventScroll:true});return;}
if(b.hasAttribute('data-report-overview')){reportCaseId=null;render();return;}
if(b.dataset.envComponent){environmentFilter=b.dataset.envComponent;if(b.hasAttribute('data-env-nav')){stopPlayback();drawerMode=null;page='environment';}render();return;}
if(b.dataset.envEvent!==undefined){environmentSelected=Number(b.dataset.envEvent);render();return;}
if(b.hasAttribute('data-env-demo')){environmentDemo=!environmentDemo;if(environmentDemo&&environmentStep===0)environmentStep=environmentDemoChanges.length;render();return;}
if(b.hasAttribute('data-env-next')){environmentStep=environmentStep>=environmentDemoChanges.length?10:environmentStep+1;environmentSelected=environmentStep-1;render();return;}
if(b.hasAttribute('data-evidence')){drawerMode='evidence';render();document.querySelector('[data-close]')?.focus({preventScroll:true});return;}
if(b.hasAttribute('data-next')){nextEvent();return;}
if(b.hasAttribute('data-play')){if(playback)stopPlayback();else if(step<events.length)playback=setInterval(nextEvent,3000);render();return;}
if(b.hasAttribute('data-reset')){resetDemo();return;}
if(b.dataset.planCase!==undefined){selectedCase=Number(b.dataset.planCase);render();return;}
if(b.dataset.caseTab){caseTab=b.dataset.caseTab;render();return;}
if(b.dataset.dimension){drawerMode=null;stage=3;render();return;}
if(b.dataset.group){expandedGroups[b.dataset.group]=!expandedGroups[b.dataset.group];render();return;}
if(b.dataset.agent){selectAgent(b.dataset.agent,b.dataset.agentRun||undefined);return;}
if(b.dataset.dataset){stopPlayback();drawerMode=null;selectedDataset=b.dataset.dataset;page='resources';render();return;}
if(b.dataset.page){stopPlayback();drawerMode=null;page=b.dataset.page;render();return;}
if(b.dataset.stage!==undefined){drawerMode=null;stage=Number(b.dataset.stage);page='tasks';render();return;}
if(b.dataset.filter){filter=b.dataset.filter;render();return;}
if(b.dataset.execStep!==undefined){selectedCase=Math.max(0,Math.min(cases.length-1,selectedCase+Number(b.dataset.execStep)));render();return;}
if(b.hasAttribute('data-runtime-report')){stopPlayback();drawerMode=null;reportCaseId=activeRun?cases[selectedCase].id:null;reportOpen=true;render();return;}
if(b.dataset.caseScore!==undefined){const i=Number(b.dataset.caseScore);caseTabs[runKey()+'::'+i]='scores';openCase(i);return;}
if(b.dataset.case!==undefined){if(b.tagName==='TR'&&stage===2){selectedCase=Number(b.dataset.case);caseTab=caseTabs[runKey()+'::'+selectedCase]||'live';render();}else openCase(Number(b.dataset.case));return;}
if(b.hasAttribute('data-close')){closeDrawer();return;}
if(b.dataset.demo)toast('设计预览：'+b.dataset.demo+'尚未连接真实接口，不会改变评测状态。');
});
document.addEventListener('change',e=>{if(e.target.id==='execution-case'){selectedCase=Number(e.target.value);render();return;}if(e.target.id==='report-scope'){reportCaseId=e.target.value||null;render();return;}});
document.addEventListener('input',e=>{if(e.target.id==='dataset-search'){datasetQuery=e.target.value;document.getElementById('dataset-tree').innerHTML=datasetTree();document.getElementById('dataset-tree').dataset.scrollKey='dataset-tree::'+datasetQuery;document.getElementById('dataset-tree').scrollTop=0;schedulePersist();return;}if(e.target.id==='search'){query=e.target.value;document.getElementById('rows').innerHTML=rows();document.getElementById('row-count').textContent='当前显示 '+filtered().length+' 条 Case';schedulePersist();}});
document.addEventListener('scroll',e=>{const el=e.target;if(el.dataset?.scrollKey){scrollPositions[el.dataset.scrollKey]={top:el.scrollTop,left:el.scrollLeft};schedulePersist();}},true);
window.addEventListener('beforeunload',()=>{captureScroll();persistUI();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(reportOpen){reportOpen=false;render();document.querySelector('[data-full-report]')?.focus({preventScroll:true});}else closeDrawer();}if(e.key==='Tab'&&reportOpen){const buttons=[...document.querySelectorAll('#report-overlay button,#report-overlay select,#report-overlay iframe')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1)?.focus();}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0]?.focus();}}if(e.key==='Enter'&&e.target.dataset.case!==undefined)e.target.click();if(e.key==='Tab'&&document.getElementById('shade')?.classList.contains('open')){const focusable=[...document.querySelectorAll('#drawer button')];if(e.shiftKey&&document.activeElement===focusable[0]){e.preventDefault();focusable.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===focusable.at(-1)){e.preventDefault();focusable[0].focus();}}});
/* Historical run data cleared; live results come from the control API. */

ensureWorkBuddyEntry();
restoreSession();
if(new URLSearchParams(location.search).get('page')==='settings')page='settings';
const requestedConsole=new URLSearchParams(location.search).get('console');if(['workbuddy','pi','langgraph','qwenwork','doubaowork','hermes','openclaw'].includes(requestedConsole))page=requestedConsole;
if(new URLSearchParams(location.search).get('page')==='datasets'){page='resources';selectedDataset='__inventory__';questionInventory.state.caseId=null;}
refreshRuntimes();
render();

</script></body></html>
